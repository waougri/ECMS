        .nav-link {
            position: relative;
            transition: color 0.3s ease;

            content: '';

            width: 0;
            height: 2px;
            background: var(--ecms-olive);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
